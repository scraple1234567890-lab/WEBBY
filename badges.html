<!DOCTYPE html>
<html data-theme="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>StarSpell Academy | Badges</title>
    <link rel="icon" sizes="any" href="./favicon.ico" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="lorePage badgesPage">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="top"></div>

    <header class="header" role="banner">
      <nav class="nav container" aria-label="Primary">
        <a class="brand" href="./index.html#top" aria-label="Home">
          <span class="brandText">StarSpell Academy</span>
        </a>

        <button id="navToggle" class="iconBtn navToggle" aria-controls="navLinks" aria-expanded="false">
          <span class="srOnly">Open menu</span>
          <span class="hamburger" aria-hidden="true"></span>
        </button>

        <div class="navLinks" id="navLinks">
          <a href="./quiz.html">Quizes</a>
          <a href="./posts.html">Posts</a>
          <a href="./articles.html">Articles</a>
          <a href="./search.html">Search</a>
          <a href="./map.html">Map</a><a href="./game.html">Game</a>
          <a class="btn ghost" href="./shop.html">Shop</a>

          <form class="navSearch" action="./search.html" method="get" role="search">
            <input class="navSearchInput" type="search" name="q" placeholder="Search…" aria-label="Search" />
            <button class="navSearchBtn" type="submit" aria-label="Run search">Go</button>
          </form>

          <div id="profileMenu" class="profileMenu" data-default-display="inline-flex" style="display: none">
            <button
              id="profileMenuToggle"
              type="button"
              class="btn ghost profileTrigger"
              aria-label="Open account menu"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="profileMenuList"
            >
              <span class="srOnly">Profile</span>
              <span class="profileAvatar profileAvatar--menu" id="profileAvatar">
                <span class="profileAvatarPlaceholder" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                    <path
                      fill="currentColor"
                      d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5Zm0 2c-3.33 0-10 1.67-10 5v1h20v-1c0-3.33-6.67-5-10-5Z"
                    ></path>
                  </svg>
                </span>
              </span>
            </button>

            <div id="profileMenuList" class="profileMenuList" role="menu">
              <a class="profileMenuItem" href="./profile.html" role="menuitem">Profile</a>
              <a class="profileMenuItem" href="./post.html" role="menuitem">Write</a>
              <button class="profileMenuItem" id="logoutBtn" role="menuitem" type="button">Log out</button>
            </div>
          </div>

          <a class="btn" data-default-display="inline-flex" href="./login.html" id="loginBtn"> Login portal </a>
        </div>
      </nav>
    </header>

    <main id="main" class="container" role="main">
      <section class="hero">
        <h1 class="heroTitle">Badges</h1>
        <p class="heroSubtitle">Little stamps of progress as you explore the world.</p>

        <div class="heroActions" style="justify-content:center; gap: 12px">
          <span class="pill" aria-label="Unlocked badges">
            <strong><span id="badgesUnlockedCount">0</span></strong> / <span id="badgesTotalCount">0</span> unlocked
          </span>
          <a class="btn ghost" href="./search.html">Browse entries</a>
        </div>
      </section>

      <section class="badgeSection" aria-label="Badge list">
        <div id="badgesGrid" class="badgeGrid"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footerRow">
        <p class="muted small">© <span id="year"></span> StarSpell Academy.</p>
        <a class="muted small" href="#top">Back to top ↑</a>
      </div>
    </footer>

    <script defer src="./script.js"></script>
    <script type="module" src="./js/app.js?v=4"></script>
    <script src="./data/badges-data.js?v=4"></script>
    <script src="./js/achievements.js?v=4"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const grid = document.getElementById("badgesGrid");
        const defs = window.SSA_BADGE_DEFS || [];

        const render = () => {
          if (!window.SSAchievements) return;
          window.SSAchievements.renderBadges(grid, defs);
          window.SSAchievements.updateBadgesStats(defs);
        };

        render();
        window.addEventListener("ssa:badgesUpdated", render);
        window.addEventListener("ssa:badgesSynced", render);
      });
    </script>
  </body>
</html>
