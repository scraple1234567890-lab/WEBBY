<!DOCTYPE html>

<html data-theme="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>StarSpell Academy | Posts</title>
<link href="./favicon.ico" rel="icon" sizes="any"/>
<link href="./favicon.png" rel="icon" type="image/png"/>
<link href="./styles.css" rel="stylesheet"/>
<style>
      .post-content {
        white-space: pre-wrap;
      }
      .postLayout {
        display: grid;
        gap: 1.5rem;
      }
      .postForm {
        display: grid;
        gap: 1rem;
      }
      .postHeader {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1rem;
      }
      .postMetaRow {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.25rem;
      }
      .postMetaText {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .profileAvatar--post {
        width: 44px;
        height: 44px;
        border-width: 1.5px;
      }
      .postComposerHeader {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .loreBoardHeader {
        text-align: center;
        position: relative;
        padding-bottom: 0.5rem;
        isolation: isolate;
      }
      .loreBoardHeader::after {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 70%;
        max-width: 540px;
        height: 140%;
        background: radial-gradient(circle at 30% 30%, rgba(255, 216, 255, 0.18), transparent 55%),
          radial-gradient(circle at 70% 70%, rgba(255, 143, 222, 0.18), transparent 55%);
        filter: blur(18px);
        z-index: -1;
        opacity: 0.9;
        pointer-events: none;
      }
      .loreTitleWrap {
        display: inline-flex;
        align-items: center;
        gap: 0.9rem;
        padding: 0.85rem 1.7rem;
        border-radius: 999px;
        background: linear-gradient(120deg, rgba(255, 234, 255, 0.16), rgba(255, 90, 209, 0.08));
        border: 1px solid rgba(255, 180, 230, 0.4);
        box-shadow: 0 10px 30px rgba(61, 14, 86, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        position: relative;
        overflow: hidden;
      }
      .loreTitleWrap::before,
      .loreTitleWrap::after {
        content: "";
        position: absolute;
        inset: -120%;
        background: conic-gradient(from 140deg, rgba(255, 255, 255, 0.28), rgba(255, 90, 209, 0.38), rgba(255, 255, 255, 0.28));
        opacity: 0.35;
        filter: blur(24px);
        animation: shimmer 12s linear infinite;
      }
      .loreTitleWrap::after {
        animation-duration: 16s;
        animation-direction: reverse;
      }
      .loreTitle {
        font-family: "Cinzel", "Times New Roman", Georgia, serif;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        font-size: clamp(1.5rem, 1.6rem + 0.8vw, 2.3rem);
        margin: 0;
        color: #fdf2ff;
        text-shadow: 0 2px 18px rgba(255, 90, 209, 0.3), 0 0 24px rgba(118, 36, 147, 0.5);
        position: relative;
        z-index: 1;
      }
      .loreSigil {
        font-size: 1.25rem;
        color: #ffe3ff;
        filter: drop-shadow(0 0 8px rgba(255, 90, 209, 0.55));
        transform: translateY(-1px);
        position: relative;
        z-index: 1;
      }
      @keyframes shimmer {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="top"></div>
<header class="header" role="banner">
<nav aria-label="Primary" class="nav container">
<a aria-label="Home" class="brand" href="./index.html#top">
<span class="brandText">StarSpell Academy</span>
</a>
<button aria-controls="navLinks" aria-expanded="false" class="iconBtn navToggle" id="navToggle">
<span class="srOnly">Open menu</span>
<span aria-hidden="true" class="hamburger"></span>
</button>
<div class="navLinks" id="navLinks">
<a href="./quiz.html">Quizes</a>
<a href="./posts.html">Posts</a>
<a href="./articles.html">Articles</a><a href="./search.html">Search</a>
<a href="./map.html">Map</a><a href="./game.html">Game</a>
<a class="btn ghost" href="./shop.html">Shop</a>
<form action="./search.html" class="navSearch" method="get" role="search"><input aria-label="Search" class="navSearchInput" name="q" placeholder="Search…" type="search"/><button aria-label="Run search" class="navSearchBtn" type="submit">Go</button></form><div class="profileMenu" data-default-display="inline-flex" id="profileMenu" style="display: none">
<button aria-controls="profileMenuList" aria-expanded="false" aria-haspopup="menu" aria-label="Open account menu" class="btn ghost profileTrigger" id="profileMenuToggle" type="button">
<span class="srOnly">Profile</span>
<span class="profileAvatar profileAvatar--menu" id="profileAvatar">
<span aria-hidden="true" class="profileAvatarPlaceholder">
<svg focusable="false" role="presentation" viewbox="0 0 24 24">
<path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5Zm0 2c-3.33 0-10 1.67-10 5v1h20v-1c0-3.33-6.67-5-10-5Z" fill="currentColor"></path>
</svg>
</span>
<img alt="" loading="lazy"/>
</span>
<span aria-hidden="true" class="profileCaret">▾</span>
</button>
<div aria-hidden="true" class="profileMenuList" id="profileMenuList" role="menu">
<a href="./profile.html" role="menuitem">View profile</a>
<button id="logoutBtn" role="menuitem" type="button">Log out</button>
</div>
</div>
<a class="btn primary magentaGlow" data-auth-target="login-cta" href="./login.html">Open the login portal</a>
</div>
</nav>
</header>
<main class="section" id="main">
<div class="container postLayout">
<div class="postHeader">
<div>
<h1>Posts</h1>
</div>
<div class="actions" style="gap: 0.5rem; align-items: center;">
<p aria-live="polite" class="muted" id="must-login" style="margin: 0">You must be logged in to post.</p>
<button aria-expanded="false" class="btn heroCta magentaGlow" id="share-post-btn" type="button">Share a post</button>
</div>
</div>
<section class="card" hidden="" id="composer-card">
<div class="postComposerHeader">
<div>
<p class="kicker">Share a post</p>
<p class="muted small">Write a short note for the Lore Board. (2000 characters max)</p>
</div>
<button class="btn ghost" id="close-composer" type="button">Close</button>
</div>
<form class="postForm" id="new-post-form">
<label class="muted small" for="post-content">What would you like to share?</label>
<textarea id="post-content" maxlength="2000" name="content" required="" rows="4"></textarea>
<div class="actions">
<button class="btn primary" id="post-submit" type="submit">Post</button>
</div>
<p aria-live="polite" class="muted small" id="post-status"></p>
</form>
</section>
<section aria-live="polite" class="card">
<div class="sectionHead loreBoardHeader">
<div class="loreTitleWrap">
<span aria-hidden="true" class="loreSigil">✶</span>
<h2 class="loreTitle">Lore Board</h2>
<span aria-hidden="true" class="loreSigil">✶</span>
</div>
</div>
<div class="postFeed" id="posts"></div>
</section>
</div>
</main>
<script defer="" src="./script.js"></script>
<script src="./js/app.js?v=4" type="module"></script>
<script src="./js/posts.js" type="module"></script>
</body>
</html>
