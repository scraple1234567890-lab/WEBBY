<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StarSpell Academy | Characters</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./characters.css" />
  </head>

  <body
    class="charactersPage"
    id="top"
    data-unlock-badge="visit:characters"
    data-unlock-title="Rostermaster"
    data-unlock-desc="Visited the characters roster."
    data-unlock-icon="🗂️"
  >
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="header" role="banner">
      <nav class="nav container" aria-label="Primary">
        <a class="brand" href="./index.html#top" aria-label="Home">
          <span class="brandText">StarSpell Academy</span>
        </a>

        <button id="navToggle" class="iconBtn navToggle" aria-controls="navLinks" aria-expanded="false">
          <span class="srOnly">Open menu</span>
          <span class="hamburger" aria-hidden="true"></span>
        </button>

        <div class="navLinks" id="navLinks">
          <a href="./quiz.html">Sorting quiz</a>
          <a href="./posts.html">Posts</a>
          <a href="./articles.html">Articles</a>
          <a href="./search.html">Search</a>
          <a href="./map.html">Map</a><a href="./game.html">Game</a>
          <a class="btn ghost" href="./shop.html">Shop</a>

          <form class="navSearch" action="./search.html" method="get" role="search">
            <input class="navSearchInput" type="search" name="q" placeholder="Search…" aria-label="Search" />
            <button class="navSearchBtn" type="submit" aria-label="Run search">Go</button>
          </form>

          <div id="profileMenu" class="profileMenu" data-default-display="inline-flex" style="display: none">
            <button
              id="profileMenuToggle"
              type="button"
              class="btn ghost profileTrigger"
              aria-label="Open account menu"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="profileMenuList"
            >
              <span class="srOnly">Profile</span>
              <span class="profileAvatar profileAvatar--menu" id="profileAvatar">
                <span class="profileAvatarPlaceholder" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                    <path
                      fill="currentColor"
                      d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5Zm0 2c-3.33 0-10 1.67-10 5v1h20v-1c0-3.33-6.67-5-10-5Z"
                    ></path>
                  </svg>
                </span>
                <img alt="" loading="lazy" />
              </span>
              <span class="profileCaret" aria-hidden="true">▾</span>
            </button>

            <div id="profileMenuList" class="profileMenuList" role="menu" aria-hidden="true">
              <a class="profileMenuItem" href="./profile.html" role="menuitem">View profile</a>
              <button class="profileMenuItem" id="logoutBtn" role="menuitem" type="button">Log out</button>
            </div>
          </div>

          <a class="btn primary magentaGlow" data-auth-target="login-cta" href="./login.html">Open the login portal</a>
        </div>
      </nav>
    </header>

    <main class="section" id="main" role="main">
      <div class="container">
        <div class="postHeader" style="margin-bottom: 12px">
          <div>
            <h1 style="margin-bottom: 4px">Characters</h1>
            <p class="muted" style="margin: 0">
              A roster page for your universe. Edit <code>data/characters.json</code> to add more, just like the timeline.
            </p>
          </div>
        </div>

        <div class="charactersLayout">
          <section class="charactersControls" aria-label="Character filters">
            <div class="charactersControlGrid">
              <label class="field">
                <span class="label">Group</span>
                <select id="charactersGroup" aria-label="Filter by group">
                  <option value="all">All groups</option>
                </select>
              </label>

              <label class="field">
                <span class="label">School</span>
                <select id="charactersSchool" aria-label="Filter by school">
                  <option value="all">All schools</option>
                </select>
              </label>

              <label class="field">
                <span class="label">Spoilers</span>
                <select id="charactersSpoiler" aria-label="Spoiler level"></select>
              </label>

              <label class="field">
                <span class="label">Search</span>
                <input id="charactersSearch" type="search" placeholder="Try: wind, core cast, Belle..." />
              </label>
            </div>

            <div class="charactersControlRow">
              <button class="btn ghost" id="charactersReset" type="button">Reset</button>
              <button class="btn ghost" id="charactersSort" type="button" aria-pressed="false">A-Z</button>

              <label class="charactersToggle" for="charactersShowLocked">
                <input id="charactersShowLocked" type="checkbox" />
                <span>Show locked entries</span>
              </label>

              <span class="muted small" id="charactersCount">0 shown</span>
            </div>
          </section>

          <section class="charactersList" id="charactersList" aria-label="Character list"></section>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footerRow">
        <p class="muted small">© <span id="year"></span> StarSpell Academy.</p>
        <a class="muted small" href="#top">Back to top ↑</a>
      </div>
    </footer>

    <script defer src="./script.js"></script>
    <script type="module" src="./js/app.js"></script>
    <script defer src="./data/characters-data.js"></script>
    <script defer src="./js/characters.js"></script>
    <script defer src="./data/badges-data.js"></script>
    <script defer src="./js/achievements.js"></script>
  </body>
</html>
