name: Daily lore post

on:
  schedule:
    # Runs once per day at 15:00 UTC (change if you want a different time)
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "lore-post"
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add lore post
        run: node scripts/add_post.js

      - name: Commit changes
        run: |
          git config user.name "Lore Bot"
          git config user.email "lorebot@example.com"
          git add data/posts.json
          git commit -m "chore: add daily lore post" || echo "No changes to commit"

      - name: Pull latest (rebase)
        run: git pull --rebase origin main

      - name: Push changes
        run: git push
